# omarchy_kids.conf (R-BOOT-2) — inserts the omarchy-kids-unlock runtime
# hook immediately before 'encrypt' in HOOKS, if 'encrypt' is present and
# ours isn't already there. No-op otherwise (e.g. a future move to
# 'sd-encrypt' — R-BOOT-2's own escape hatch).
#
# NAMING DEVIATION FROM SPEC.md: SPEC.md's R-BOOT-2 names this file
# 'omarchy-kids.conf'. /etc/mkinitcpio.conf.d/*.conf is sourced by mkinitcpio
# in lexical (byte) order, and on the reference machine the HOOKS array
# itself is *set* — not appended to — by 'omarchy_hooks.conf' (underscore).
# A hyphen sorts before an underscore in byte order ('-' is 0x2D, '_' is
# 0x5F), so a file literally named 'omarchy-kids.conf' would be sourced
# BEFORE 'omarchy_hooks.conf' runs, see nothing in HOOKS yet, insert
# nothing, and then have its (nonexistent) edit silently thrown away when
# 'omarchy_hooks.conf' assigns HOOKS afterward. That would satisfy "do
# nothing otherwise" for every real boot and never add the hook at all —
# exactly the silent failure I-9 exists to rule out. So this file is named
# 'omarchy_kids.conf' (underscore) instead, which sorts right after
# 'omarchy_hooks.conf'. See docs/boot.md for the full note.
#
# Idempotent (source it twice, or start from a HOOKS that already has ours,
# and it's a no-op the second time) and safe under `set -u`.

if [ "${HOOKS+set}" = set ] && [ "${#HOOKS[@]}" -gt 0 ]; then
    _omarchy_kids_has_encrypt=0
    _omarchy_kids_has_ours=0
    for _omarchy_kids_h in "${HOOKS[@]}"; do
        if [ "$_omarchy_kids_h" = "encrypt" ]; then
            _omarchy_kids_has_encrypt=1
        elif [ "$_omarchy_kids_h" = "omarchy-kids-unlock" ]; then
            _omarchy_kids_has_ours=1
        fi
    done

    if [ "$_omarchy_kids_has_encrypt" -eq 1 ] && [ "$_omarchy_kids_has_ours" -eq 0 ]; then
        _omarchy_kids_new=()
        for _omarchy_kids_h in "${HOOKS[@]}"; do
            if [ "$_omarchy_kids_h" = "encrypt" ]; then
                _omarchy_kids_new+=("omarchy-kids-unlock")
            fi
            _omarchy_kids_new+=("$_omarchy_kids_h")
        done
        HOOKS=("${_omarchy_kids_new[@]}")
    fi

    unset _omarchy_kids_h _omarchy_kids_new _omarchy_kids_has_encrypt _omarchy_kids_has_ours
fi
