# thonny is AUR-only (issue #52 audit); pyzo is extra's own beginner-
# friendly interactive Python IDE, same kind for this band's "coding"
# category, so it replaces thonny here instead of adding another aur:
# entry.
[[app]]
pkg = "pyzo"
source = "extra"
id = "pyzo"
label = "Pyzo"
category = "coding"
age = "13+"

[[app]]
pkg = "kstars"
source = "extra"
id = "kstars"
label = "KStars"
category = "reference"
age = "13+"

# web = "filtered" for this band (Appendix B): filtered open web adds no
# URLAllowlist (R-WEB-3), so this band has no walled garden. Left empty
# rather than omitted so every pack file has the same shape for tooling.
[garden]
sites = []
