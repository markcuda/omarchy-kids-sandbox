# Starter pack for band 3-5 (SPEC.md R-BAND, Appendix C).
# `id` is the launcher entry id `omarchy-kids-conf get <kid> allowlist`
# falls back to when a kid has no override (the full pack, in file order).
# `source` (extra/aur) is issue #52's audit against archlinux.org's package search API; see docs/apps.md.

[[app]]
pkg = "gcompris-qt"
source = "extra"
id = "gcompris"
label = "GCompris"
category = "education"
age = "3-5"

[[app]]
pkg = "aur:tuxpaint"
source = "aur"
id = "tuxpaint"
label = "Tux Paint"
category = "creativity"
age = "3-5"

[[app]]
pkg = "ktuberling"
source = "extra"
id = "ktuberling"
label = "KTuberling"
category = "play"
age = "3-5"

[[app]]
pkg = "blinken"
source = "extra"
id = "blinken"
label = "Blinken"
category = "games"
age = "3-5"

# web = "none" for this band (Appendix B): Chromium is hidden from the
# launcher entirely (R-WEB-3), so there is no walled-garden allowlist to
# build. Left empty rather than omitted so every pack file has the same
# shape for tooling.
[garden]
sites = []
