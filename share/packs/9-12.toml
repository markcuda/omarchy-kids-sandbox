# web = "garden" for this band (Appendix B): these hosts become the
# URLAllowlist alongside the kid's own approved sites (R-WEB-3). Short
# and obviously safe on purpose.
[garden]
sites = [
  "pbskids.org",
  "kids.nationalgeographic.com",
  "scratch.mit.edu",
  "youtubekids.com",
  "wikipedia.org",
]
