# --password-store=basic, not gnome-libsecret: with libsecret Chromium asked the kid to create a
# GNOME keyring on first launch (seen live). Kids never save passwords (PasswordManagerEnabled=false).
--ozone-platform=wayland
--ozone-platform-hint=wayland
--password-store=basic
--enable-features=TouchpadOverscrollHistoryNavigation
