[General]
# Colors for Main.qml, read back through SDDM's own "config" context
# property (a QQmlPropertyMap of this file's [General] keys -- confirmed
# against upstream sddm/sddm's src/greeter/GreeterApp.cpp and
# src/common/ThemeConfig.cpp: Qt's QSettings treats the "General" group
# specially, so these keys come back as plain config.<key>, no
# "General/" prefix). Checked against Omarchy's own installed theme
# (default/sddm/omarchy/theme.conf upstream) first: that file is just
# "[General]" with nothing in it -- every color there is hardcoded in
# its Main.qml (background #1a1b26), so there is nothing to copy keys
# from. backgroundColor below reuses that one confirmed value; every
# other key is this repo's own sane dark palette, matching the tile/
# accent colors already used by share/launcher/shell.qml so the portal
# and the Level 1 launcher read as the same product.
backgroundColor=#1a1b26
tileColor=#232838
tileHighlightColor=#3a4266
parentTileColor=#1f2335
accentColor=#8fb8ff
textColor=#ffffff
mutedTextColor=#9aa5ce
errorColor=#f7768e
fontFamily=JetBrainsMono Nerd Font
